name: SentinelGate DevSecOps

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build solution
        run: dotnet build SentinelGate.sln --configuration Release

      - name: Install Gitleaks CLI
        run: |
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --location --silent --show-error "$release_url/$archive" \
            --output "$RUNNER_TEMP/$archive"
          curl --fail --location --silent --show-error "$release_url/gitleaks_${version}_checksums.txt" \
            --output "$RUNNER_TEMP/gitleaks_checksums.txt"
          cd "$RUNNER_TEMP"
          grep "  ${archive}$" gitleaks_checksums.txt | sha256sum --check -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan repository secrets
        run: gitleaks git --redact --report-format json --report-path gitleaks.json --exit-code 0

      - name: Install Semgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y pipx
          pipx install semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan C# source with Semgrep
        run: semgrep scan --config p/csharp --json --output semgrep.json --no-error .

      - name: Build API container
        run: docker build --tag sentinelgate-target-api:ci ./TargetApi

      - name: Scan API container with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: sentinelgate-target-api:ci
          format: json
          output: trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Generate unified security report
        run: >-
          dotnet run --project ScannerEngine/ScannerEngine.csproj --configuration Release --
          --semgrep semgrep.json
          --gitleaks gitleaks.json
          --trivy trivy.json
          --output Dashboard/security-report.json

      - name: Upload scanner and unified JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gitleaks.json
            semgrep.json
            trivy.json
            Dashboard/security-report.json
          if-no-files-found: warn

      - name: Enforce HIGH and CRITICAL severity gate
        if: success() && github.event_name == 'pull_request'
        run: >-
          dotnet run --project ScannerEngine/ScannerEngine.csproj
          --configuration Release --no-build --no-restore --
          --semgrep semgrep.json
          --gitleaks gitleaks.json
          --trivy trivy.json
          --output Dashboard/security-report.json
          --fail-on HIGH,CRITICAL
